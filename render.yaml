# render.yaml — Render deployment config for both services
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Service 1: Full Agent Server (the brain) ──────────────────────────────
  # This handles all user requests, manages sandboxed projects, runs terminal
  # commands, reads/writes files, and orchestrates the multi-agent loop.
  - type: web
    name: lovable-clone-agent
    runtime: python
    region: oregon
    plan: free
    rootDir: agent_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      # Sandbox folder — use /tmp on Render's ephemeral filesystem
      - key: SANDBOX_PATH
        value: /tmp/lovable-sandbox
      # Sessions folder for persisting cooldowns
      - key: SESSIONS_PATH
        value: /tmp/lovable-sessions
      # ─────────────────────────────────────────────────────────────
      # Add your actual API key values in Render's Environment dashboard.
      # At minimum set GEMINI_API_KEY. Others are optional fallbacks.
      # ─────────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ── Service 2: LLM Proxy (holds API keys securely) ────────────────────────
  # Thin gateway that injects real API keys and forwards to Gemini/Groq/etc.
  # Add your actual API key values in Render's Environment dashboard.
  - type: web
    name: lovable-clone-proxy
    runtime: python
    region: oregon
    plan: free
    rootDir: llm_proxy
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
